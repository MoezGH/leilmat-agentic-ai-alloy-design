name: tests

# Three jobs:
#   - fast       : push / PR — pytest -m "not slow" + the 6061-T6 demo (≤ 3 min)
#   - slow       : nightly + dispatch — full pytest suite (≤ 30 min)
#   - scorecard  : nightly + dispatch — regenerate docs/SCORECARD.md, commit on diff
#
# Heavy / optional dependencies are filtered out of the fast install to keep
# CI under three minutes: `matgl`, `chromadb`, `sentence-transformers`, `torch`,
# `botorch`, `gpytorch`.  The test gate in
# `apps/api/ml/eval/test_formation_energy.py` calls `pytest.importorskip("matgl")`
# so the M3GNet tests skip cleanly when matgl is absent.  The slow job installs
# the full requirements.txt and runs the deselected slow-marked tests too.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 03:00 UTC every day — runs the slow job + scorecard regeneration
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write     # scorecard job commits docs/SCORECARD.md

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Fast job: pytest -m "not slow" + smoke-test the 6061-T6 demo
  # ─────────────────────────────────────────────────────────────────
  fast:
    name: fast — pytest non-slow + demo smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name != 'schedule'   # nightly runs slow + scorecard, not fast

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install fast-tier dependencies
        run: |
          python -m pip install --upgrade pip
          # Drop the heavy / optional deps that the fast tier doesn't need.
          # Keep pycalphad / scheil / fipy / taichi (they're imported by fast
          # tests).  Skip torch/matgl/chromadb/sentence-transformers — those
          # are exercised by the slow / scorecard jobs.
          grep -vE '^(torch|matgl|chromadb|sentence-transformers|botorch|gpytorch)([=<>~!@]|$)' \
              apps/api/requirements.txt > /tmp/requirements-fast.txt
          echo "=== fast-tier requirements ==="
          cat /tmp/requirements-fast.txt
          pip install -r /tmp/requirements-fast.txt

      - name: pytest -m "not slow"
        run: |
          pytest apps/api/ -m "not slow" --tb=short -q

      - name: Demo smoke test — 6061-T6 walkthrough
        run: |
          python scripts/demo_6061_t6.py

  # ─────────────────────────────────────────────────────────────────
  # Slow job: full pytest including slow-marked tests
  # ─────────────────────────────────────────────────────────────────
  slow:
    name: slow — full pytest incl. Scheil/Taichi/LOO
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: pytest (incl. slow)
        run: |
          pytest apps/api/ --tb=short -q

  # ─────────────────────────────────────────────────────────────────
  # Scorecard regeneration job — runs nightly and commits the diff
  # ─────────────────────────────────────────────────────────────────
  scorecard:
    name: scorecard — regenerate docs/SCORECARD.md
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          # Need write-with-token so we can push the docs/SCORECARD.md update
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt

      - name: Regenerate scorecard (full refresh + slow runners)
        run: |
          python -m apps.api.ml.eval.unified_scorecard --refresh all --include-slow

      - name: Commit and push scorecard if changed
        run: |
          if git diff --quiet -- docs/SCORECARD.md; then
            echo "no scorecard change — skipping commit"
            exit 0
          fi
          git config user.name "leilmat-ci"
          git config user.email "ci@leilmat.dev"
          git add docs/SCORECARD.md
          git commit -m "ci: regenerate docs/SCORECARD.md ($(date -u +%Y-%m-%d))"
          git push
