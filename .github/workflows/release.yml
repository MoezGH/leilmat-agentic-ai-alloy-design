name: Release

# Runs when a maintainer pushes a version tag (v0.1.0, v1.2.3-rc1, ...).
# It publishes generic images for people who self-host. A hosted deployment sets NEXT_PUBLIC_*
# values at build time (Next.js inlines them), so an operator builds the web image from the
# same tag with their own build arguments instead of pulling this one; see docs/hosting-model.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v7

      - name: Names and version
        run: |
          echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          build-args: LEILMAT_VERSION=${{ env.VERSION }}
          tags: |
            ghcr.io/${{ env.OWNER }}/leilmat-api:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER }}/leilmat-api:latest

      - name: Web image (no accounts, no billing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/leilmat-web:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER }}/leilmat-web:latest

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
