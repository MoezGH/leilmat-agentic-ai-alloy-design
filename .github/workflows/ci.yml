name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      # taichi links X11/GL libraries even when it runs headless on the CPU.
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libx11-6 libxrender1 libxext6 libxcursor1 libxinerama1 libxi6 libxrandr2 libglu1-mesa libgomp1 libxxf86vm1

      - name: Install
        run: |
          pip install -r apps/api/requirements.txt
          pip install pytest

      # Trained models are not in git (a pickle runs code when loaded), so train them as a user would.
      # About half a minute; it also exercises the training code on every run.
      - name: Train the property models
        run: python -m apps.api.ml.training

      # Pull requests skip the multi-minute Scheil-Gulliver simulations; main runs everything.
      - name: Tests (pull request, without the slow simulations)
        if: github.event_name == 'pull_request'
        run: python -m pytest apps/api -q -m "not slow"

      - name: Tests (main, everything)
        if: github.event_name != 'pull_request'
        run: python -m pytest apps/api -q

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - run: npm test

      # Every text/background pair in both themes must meet its WCAG contrast target.
      - run: node scripts/check-contrast.mjs

      # No environment at all: this is the build a self-hoster gets, with accounts and billing off.
      - name: Build with no NEXT_PUBLIC_* set
        run: npm run build
