<svg width="554" height="462" viewBox="0 0 554 462" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    LeilMat favicon — sibling to leil.xyz/favicon.svg.

    Geometry is identical to the master leil.xyz mark (same 554×462
    viewBox, same translate(46, 0), same 5 dot positions, same 5
    radii) so the LeilMat icon reads as part of the Leil family at
    16×16 in a browser tab.  Only the dot palette differs: the master
    mark uses three muted grays (#9ca3af / #d1d5db / #6b7280), this
    one uses three tones of warm gold drawn from the LeilMat brand
    accent (hsl(38 96% 60%)) so the icon matches the rest of the app.

    Brand palette
    ─────────────
      #f7af41   ≈ hsl(38 92% 61%)   primary  (matches --accent)
      #fbcb86   ≈ hsl(34 93% 75%)   lighter
      #cc8633   ≈ hsl(33 60% 50%)   anchor   (deeper accent for contrast)
  -->
  <g transform="translate(46, 0)">
    <circle cx="231"   cy="231" r="231"  fill="white"/>
    <circle cx="144"   cy="144" r="43.3" fill="#f7af41"/>
    <circle cx="253"   cy="253" r="21.7" fill="#fbcb86"/>
    <circle cx="180.5" cy="325" r="14.4" fill="#f7af41"/>
    <circle cx="289"   cy="108" r="18"   fill="#fbcb86"/>
    <circle cx="108"   cy="253" r="10.8" fill="#cc8633"/>
  </g>
</svg>
